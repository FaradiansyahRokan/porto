<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
<meta name="theme-color" content="#050507"/>
<meta name="description" content="Rokan S. F. — Founder of Archipelago Dynamics, Fullstack, DevOps & Web3 Architect."/>
<title>Rokan S. F. — Spatial Portfolio</title>
<link rel="icon" type="image/svg+xml" href="./assets/R.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="module" crossorigin src="/porto/assets/index-CZN1L1Ls.js"></script>
  <link rel="modulepreload" crossorigin href="/porto/assets/three-xDudt3c8.js">
  <link rel="modulepreload" crossorigin href="/porto/assets/gsap-DDlvirwQ.js">
  <link rel="stylesheet" crossorigin href="/porto/assets/index-hbbvmeST.css">
</head>
<body data-paradigm="singularity">

<!-- ── PRELOADER ──────────────────────────────── -->
<div id="preloader">
    <div class="loader-aura" aria-hidden="true"></div>
    <div class="loader-content">
        <span class="loader-kicker">Archipelago Dynamics</span>
        <h1 data-text="Rokan S. F.">Rokan S. F.</h1>
        <p class="sub">Founder · Systems Architect · Engineer</p>
        <div class="loader-progress-wrap">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="loader-meta">
                <span class="loader-status" id="loader-status">Preparing space...</span>
                <span class="loader-pct" id="loader-pct">0%</span>
            </div>
        </div>
        <button id="start-btn" type="button" disabled>Initializing...</button>
    </div>
</div>

<!-- ── 3D CANVAS ──────────────────────────────── -->
<canvas class="webgl"></canvas>

<!-- ── TOP NAVIGATION BAR (iOS Frosted Bar) ───── -->
<header class="hud-header" id="hud-header">
    <!-- Left: Identity -->
    <div class="header-left">
        <button type="button" class="logo" id="logo-trigger" title="Triple-click for Matrix Mode">
            <span>RSF</span>
        </button>
        <div class="brand-meta">
            <div class="brand-name">
                <span>Rokan S. F.</span>
                <span class="brand-status" title="Online"></span>
            </div>
            <span class="brand-role">Founder · Systems Architect</span>
        </div>
    </div>

    <!-- Center: iOS Segmented Atmosphere Control -->
    <div class="paradigm-switcher" role="group" aria-label="Atmosphere Mode">
        <button type="button" class="ps-btn active" data-paradigm="singularity" title="Obsidian (Key: 1)">Obsidian</button>
        <button type="button" class="ps-btn" data-paradigm="architect" title="Slate (Key: 2)">Slate</button>
        <button type="button" class="ps-btn" data-paradigm="apex" title="Warmth (Key: 3)">Warmth</button>
    </div>

    <!-- Right: Clean Actions -->
    <div class="header-actions">
        <button type="button" class="hud-action-btn hud-action-btn--primary" id="index-btn" aria-expanded="false" aria-controls="quick-drawer">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Index</span>
        </button>

        <a class="hud-action-btn" href="./assets/PORTOFOLIO_ROKAN.pdf" target="_blank" rel="noopener">
            <span>CV</span>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M5 11L11 5M11 5H6.5M11 5V9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <button type="button" class="audio-btn" id="audio-btn" aria-label="Toggle sound">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <span id="audio-text">Sound</span>
        </button>
    </div>
</header>

<!-- ── SUB-HEADER FILTER PILLS ────────────────── -->
<nav class="hud-filters" id="hud-filters" aria-label="Filter projects">
    <button type="button" class="filter-pill active" data-filter="all">All <span class="pill-count">13</span></button>
    <button type="button" class="filter-pill" data-filter="origin">About</button>
    <button type="button" class="filter-pill" data-filter="web">Web &amp; Cloud</button>
    <button type="button" class="filter-pill" data-filter="mobile">Android</button>
    <button type="button" class="filter-pill" data-filter="infra">Infrastructure</button>
    <button type="button" class="filter-pill" data-filter="web3">Web3</button>
    <button type="button" class="filter-pill" data-filter="credentials">Credentials</button>
</nav>

<!-- ── LEFT 3D CLOSE-UP CONTROLS ──────────────── -->
<div class="relic-viewport-hud" id="relic-viewport-hud" aria-hidden="true">
    <div class="rvh-controls">
        <span class="rvh-hint">Drag object to rotate</span>
        <div class="rvh-btn-row">
            <button type="button" class="rvh-btn" id="pulse-relic-btn">Pulse</button>
            <button type="button" class="rvh-btn rvh-btn--ghost" id="exit-orbit-btn">Overview</button>
        </div>
    </div>
</div>

<!-- ── BOTTOM DYNAMIC PILL DOCK ───────────────── -->
<div class="hud-dock" id="hud-dock">
    <div class="orbital-compass">
        <div class="compass-pod">
            <button type="button" class="dock-nav-btn" id="prev-node-btn" title="Previous (Left Arrow)" aria-label="Previous">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8 10 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <button type="button" class="dock-current-node" id="dock-current-btn" title="Open details">
                <span class="dock-node-kicker" id="dock-node-kicker">00 · Origin</span>
                <span class="dock-node-title" id="dock-node-title">Rokan S. F.</span>
            </button>

            <button type="button" class="dock-nav-btn" id="next-node-btn" title="Next (Right Arrow)" aria-label="Next">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>

        <div class="compass-ticks" id="compass-ticks" role="tablist" aria-label="Quick select"></div>
    </div>
</div>

<!-- ── INDEX DRAWER (iOS Slide-Over Sheet) ────── -->
<aside class="quick-drawer" id="quick-drawer" aria-hidden="true" aria-label="Project Index">
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="drawer-panel">
        <div class="drawer-header">
            <div>
                <span class="drawer-kicker">13 Entries</span>
                <h2 class="drawer-title">Index</h2>
            </div>
            <button type="button" class="close-btn" id="drawer-close-btn" aria-label="Close index">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="drawer-list" id="drawer-list"></div>
    </div>
</aside>

<!-- ── RIGHT DETAIL SHEET (iOS Floating Sheet) ── -->
<div id="detail-panel" class="overlay" role="dialog" aria-modal="false" aria-labelledby="panel-title">
    <canvas id="modal-particles" class="modal-particles"></canvas>

    <div class="modal-card">
        <!-- Header Artwork -->
        <div class="modal-visual-col">
            <img id="panel-image" class="modal-img" src="" alt=""/>
            <div class="modal-img-overlay"></div>
            <div class="modal-type-badge" id="modal-type-badge">Project</div>

            <div class="modal-visual-meta" id="modal-visual-meta">
                <div class="mv-item">
                    <span class="mv-label">Role</span>
                    <span class="mv-val" id="modal-meta-role">Lead Engineer</span>
                </div>
                <div class="mv-item">
                    <span class="mv-label">Timeline</span>
                    <span class="mv-val" id="modal-meta-year">2024</span>
                </div>
                <div class="mv-item">
                    <span class="mv-label">Status</span>
                    <span class="mv-val" id="modal-status-text">Active</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="modal-content-col">
            <div class="modal-topbar">
                <div class="modal-topbar-left">
                    <span class="modal-code-badge" id="panel-code">00</span>
                    <span class="modal-kicker" id="panel-kicker"></span>
                </div>
                <button type="button" class="close-btn" id="close-btn" aria-label="Close">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div class="modal-title-block">
                <h2 class="modal-title" id="panel-title"></h2>
                <p class="modal-subtitle" id="panel-subtitle"></p>
            </div>

            <p class="modal-desc" id="panel-desc"></p>

            <div id="panel-dynamic-content"></div>

            <div class="modal-footer">
                <div class="modal-footer-nav">
                    <button type="button" class="modal-nav-btn" id="modal-prev-btn">
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8 10 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>Prev</span>
                    </button>
                    <button type="button" class="modal-nav-btn" id="modal-next-btn">
                        <span>Next</span>
                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>

                <a class="modal-btn" id="panel-link" href="#" target="_blank" rel="noopener">
                    <span class="modal-btn-text">Open</span>
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 9.5L9.5 2.5M9.5 2.5H4.5M9.5 2.5V7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ── HIDDEN TELEMETRY / EASTER EGG HOOKS ────── -->
<div style="display:none">
    <span id="hud-x"></span><span id="hud-y"></span><span id="hud-z"></span>
    <span id="hud-visitors"></span><span id="hud-sims"></span>
    <span id="modal-coords"></span><span id="modal-footer-meta"></span>
    <span id="compass-manifesto"></span>
    <button id="about-quick-btn" type="button"></button>
    <button id="reset-cam-btn" type="button"></button>
    <button id="blade-pulse-btn" type="button"></button>
</div>
<div class="waypoint-label" id="waypoint-label"></div>
<div class="scroll-hint" id="scroll-hint" style="display:none"></div>
<p class="hint-text" id="hint-text" style="display:none"></p>

<!-- ── GLITCH OVERLAY ────────────────────────── -->
<div id="glitch-overlay">
    <div class="glitch-scan"></div>
    <div class="glitch-text">MATRIX MODE</div>
    <div class="glitch-code" id="glitch-code"></div>
    <button type="button" class="glitch-exit" onclick="window.experience?._triggerGlitch()">Exit</button>
</div>

<!-- ── TOAST NOTIFICATION (iOS Dynamic Pill) ──── -->
<div id="secret-msg" role="status" aria-live="polite"></div>

<!-- ── PALE BLUE DOT & DREAM OVERLAYS ─────────── -->
<div id="pbd-overlay"><div class="pbd-dot"></div><div class="pbd-quote"></div><div class="pbd-sub">Scroll to return</div></div>
<div id="rc-overlay"><div class="rc-rain" id="rc-rain"></div></div>
<div id="dream-overlay"><div class="dream-fragment"></div><div class="dream-text"></div><div class="dream-source">Memory Core</div></div>
<div id="patience-overlay"><div class="patience-text"></div><div class="patience-sub">Stay still.</div></div>

<script>
const msgs=['Preparing space...','Calibrating optics...','Loading geometry...','Almost ready...'];
let mi=0;const el=document.getElementById('loader-status');
const statusIv=setInterval(()=>{
    const btn=document.getElementById('start-btn');
    if(btn&&btn.classList.contains('active')){clearInterval(statusIv);return;}
    mi=(mi+1)%msgs.length;
    if(el)el.textContent=msgs[mi];
},1600);

const gc=document.getElementById('glitch-code');
const chars='01アイウエオカキクケコサシスセソRSF';
setInterval(()=>{
    if(gc&&document.getElementById('glitch-overlay')?.classList.contains('active')){
        const line=Array.from({length:24},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
        const d=document.createElement('div');d.textContent=line;d.style.opacity=.1+Math.random()*.35;
        gc.appendChild(d);if(gc.children.length>18)gc.removeChild(gc.firstChild);
    }
},80);

window.addEventListener('bhClick',()=>window._bhClickCallback?.());
</script>
</body>
</html>
