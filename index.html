<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#000000"/>
<title>Rokan S.F. — Interstellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="module" crossorigin src="/porto/assets/index-BWnLInkR.js"></script>
  <link rel="stylesheet" crossorigin href="/porto/assets/index-DluHGSCV.css">
</head>
<body>

<div id="preloader">
    <div class="hud-lines"></div>
    <div class="loader-content">
        <h1 data-text="ROKAN S.F.">ROKAN S.F.</h1>
        <p class="sub">Founder · Engineer · Visionary</p>
        <div class="bar-track"><div class="bar-fill"></div></div>
        <p class="loader-status" id="loader-status">Scanning deep space...</p>
        <button id="start-btn" disabled>// INITIALIZING UNIVERSE //</button>
    </div>
</div>

<canvas class="webgl"></canvas>

<header>
    <div class="logo">RSF</div>
    <button class="audio-btn" id="audio-btn">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <span id="audio-text">SFX</span>
    </button>
</header>

<div class="hud-coords" id="hud-coords">
    <div id="hud-x">X: 0.000</div>
    <div id="hud-y">Y: 0.000</div>
    <div id="hud-z">Z: 0.000</div>
    <div style="margin-top:4px;opacity:.45;letter-spacing:.08em">SECTOR-7G · VOID CLASS</div>
</div>

<p class="hint-text" id="hint-text" style="display:none">— tap a planet to explore —</p>

<div class="touch-indicator">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="white" stroke-width="1.1" opacity=".28">
        <circle cx="13" cy="13" r="11"/><circle cx="13" cy="13" r="4.5"/>
    </svg>
    <span style="font-family:'Space Mono',monospace;font-size:.42rem;color:rgba(255,255,255,.25);letter-spacing:.14em">TAP</span>
</div>

<div id="detail-panel" class="overlay">
    <div class="modal-card">
        <div class="modal-image-col"><img id="panel-image" src="" alt=""/></div>
        <div class="modal-content-col">
            <button class="close-btn" id="close-btn">✕</button>
            <span class="modal-kicker" id="panel-kicker"></span>
            <h2 class="modal-title" id="panel-title"></h2>
            <p class="modal-desc" id="panel-desc"></p>
            <div id="panel-dynamic-content"></div>
            <a class="modal-btn" id="panel-link" href="#" target="_blank">View Project ↗</a>
        </div>
    </div>
</div>

<script>
const msgs=['Scanning deep space...','Calibrating hyperdrive...','Mapping stellar coords...','Initializing quantum matrix...','Detecting dark matter...','Neural link active...','Loading dimension data...','Warping spacetime...'];
let mi=0;const el=document.getElementById('loader-status');
setInterval(()=>{mi=(mi+1)%msgs.length;if(el&&!document.getElementById('start-btn').classList.contains('active'))el.textContent=msgs[mi];},1900);
</script>
</body>
</html>
